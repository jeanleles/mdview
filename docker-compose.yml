services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: /app/data/mdview.db
      PORT: 3000
    volumes:
      - sqlite_data:/app/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  seed:
    profiles: ["seed"]
    build:
      context: .
      target: builder
    env_file: .env
    environment:
      DATABASE_URL: /app/data/mdview.db
    volumes:
      - sqlite_data:/app/data
    command: npm run seed

volumes:
  sqlite_data:
  caddy_data:
  caddy_config:
